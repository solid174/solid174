# The snake under the README, eating my contribution graph: Catppuccin Mocha for GitHub's
# dark theme, Latte for the light one. The SVGs land on the `output` branch, rewritten in a
# single commit each run, so neither branch grows a commit a day.
name: snake

on:
  schedule:
    - cron: "17 3 * * *" # daily, off the top of the hour when scheduled runs pile up
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # dots: empty, then green mixed into the background at 35/60/80/100% per contribution level
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-mocha.svg?color_snake=#cba6f7&color_dots=#313244,#4e6356,#709473,#8bbc8a,#a6e3a1
            dist/snake-latte.svg?color_snake=#8839ef&color_dots=#ccd0da,#b2d5ae,#86c07c,#63b053,#40a02b

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
